# Reusable backport workflow called by plugin repositories from their
# pull_request_target wrapper when a PR is closed or labeled.
# Only merged PRs are processed; labels must match "backport to <branch>".

name: Plugin Backport

on:
  workflow_call:

jobs:
  backport:
    name: Backport
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Only react to merged PRs for security reasons.
    # See https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target.
    if: >
      github.event.pull_request.merged
      && (
        github.event.action == 'closed'
        || (
          github.event.action == 'labeled'
          && contains(github.event.label.name, 'backport')
        )
      )
    steps:
      - uses: tibdex/backport@v2
        with:
          github_token: ${{ github.token }}
          body_template: "Backport <%= mergeCommitSha %> from #<%= number %> to <%= base %>.\n\n<%= body %>"
          label_pattern: "^backport to (?<base>([^ ]+))$"
          # Include the original labels from the merged PR (minus any matching label_pattern)
          labels_template: "<% print(JSON.stringify(labels)) %>"
          title_template: "🔙 from #<%= number %> - <%= title %>"
