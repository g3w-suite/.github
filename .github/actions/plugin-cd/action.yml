# Shared release preparation. PyPI publishing must remain in the caller workflow
# because its Docker-based action does not work when nested in a composite action.

name: Plugin CD
description: Prepare and build a G3W-ADMIN plugin release.

inputs:
  github-token:
    description: Token used to check out the source and update the repository release.
    required: true

outputs:
  proceed:
    description: Whether this commit is eligible for release.
    value: ${{ steps.version.outputs.proceed }}
  tag:
    description: Release tag to publish.
    value: ${{ steps.version.outputs.tag }}
  existing:
    description: Whether the release tag already exists.
    value: ${{ steps.version.outputs.existing }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        persist-credentials: false
        token: ${{ inputs.github-token }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # Reuse an existing tag on reruns, wait for the newest branch commit, and
    # require an existing stable tag before automatic versioning starts.
    - name: Select next version
      id: version
      env:
        COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        BRANCH: ${{ github.event.workflow_run.head_branch }}
        GH_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        tag=$(git tag -l 'v*' --format='%(refname:short) %(contents:subject)' | sed -n "s/^\(v[0-9][0-9]*\.[0-9]\.[0-9]\) Automated release for $COMMIT_SHA$/\1/p" | head -n 1)
        if [ -z "$tag" ]; then
          git check-ref-format --branch "$BRANCH" >/dev/null
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          current=$(git -c http.extraheader="$auth" ls-remote --exit-code origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$current" != "$COMMIT_SHA" ]; then
            echo "Branch has advanced; waiting for CI on its latest commit."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]\.[0-9]$' | sort -V | tail -n 1 || true)
          if [ -z "$latest" ]; then
            echo "::notice::No stable version tag found; seed one before enabling automatic releases."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump() {
            local major minor patch
            IFS=. read -r major minor patch <<< "${1#v}"
            patch=$((patch + 1))
            if [ "$patch" -eq 10 ]; then
              patch=0
              minor=$((minor + 1))
            fi
            if [ "$minor" -eq 10 ]; then
              minor=0
              major=$((major + 1))
            fi
            echo "v$major.$minor.$patch"
          }
          test "$(bump v1.2.3)" = v1.2.4
          test "$(bump v1.2.9)" = v1.3.0
          test "$(bump v1.9.9)" = v2.0.0
          tag=$(bump "$latest")
          echo "existing=false" >> "$GITHUB_OUTPUT"
        else
          echo "existing=true" >> "$GITHUB_OUTPUT"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "proceed=true" >> "$GITHUB_OUTPUT"
    # setuptools_scm normally reads the version from Git tags; this value lets
    # the release artifact be built before the release tag is pushed.
    - name: Build package
      if: ${{ steps.version.outputs.proceed == 'true' }}
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check dist/*
